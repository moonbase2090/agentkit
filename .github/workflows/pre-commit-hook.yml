name: pre-commit-hook

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Run the pre-commit hook on the whole tree
        run: |
          git add -A
          sh .githooks/pre-commit
