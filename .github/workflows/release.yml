name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build release binaries
        run: cargo build --release --locked -p demo
      - name: Stage artifacts
        run: |
          set -eu
          mkdir -p dist
          cp target/release/ci-triage target/release/run-due dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bins
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bins
          path: dist
      - name: Check release text
        env:
          RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          title="$tag"
          body_file="CHANGELOG.md"
          if [ ! -f "$body_file" ]; then
            body_file="README.md"
          fi
          tag_message="$(git tag -l --format='%(contents)' "$tag" 2>/dev/null || true)"
          chmod +x scripts/check-release-text.sh
          scripts/check-release-text.sh \
            --tag-message "$tag_message" \
            --release-title "$title" \
            --release-body-file "$body_file" \
            --artifact dist/ci-triage \
            --artifact dist/run-due
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          body_file="CHANGELOG.md"
          if [ ! -f "$body_file" ]; then
            body_file="README.md"
          fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes-file "$body_file"
